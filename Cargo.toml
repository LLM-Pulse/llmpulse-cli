[package]
name = "llmpulse-cli"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Official command-line client for LLM Pulse"
license = "MIT"
homepage = "https://llmpulse.ai"
repository = "https://github.com/LLM-Pulse/llmpulse-cli"
readme = "README.md"
keywords = ["llmpulse", "cli", "analytics", "ai-visibility", "geo"]
categories = ["command-line-utilities", "web-programming::http-client"]

[[bin]]
name = "llmpulse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
comfy-table = "=7.1.4"
csv = "1.4"
dialoguer = "0.12"
dirs = "6.0"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
