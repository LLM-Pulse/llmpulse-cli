name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (for example v2.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: llmpulse-linux-x86_64
            binary: llmpulse
          - os: macos-15-intel
            asset: llmpulse-macos-x86_64
            binary: llmpulse
          - os: macos-15
            asset: llmpulse-macos-aarch64
            binary: llmpulse
          - os: windows-2022
            asset: llmpulse-windows-x86_64
            binary: llmpulse.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "${{ matrix.asset }}"
          cp "target/release/${{ matrix.binary }}" README.md LICENSE "${{ matrix.asset }}/"
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ matrix.asset }}"
          Copy-Item "target/release/${{ matrix.binary }}", "README.md", "LICENSE" -Destination "${{ matrix.asset }}"
          Compress-Archive -Path "${{ matrix.asset }}" -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --verify-tag

  npm:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir artifacts
      - run: node npm/build.mjs "${TAG#v}" artifacts npm-dist > npm-dirs.txt
      - env:
          NPM_PUBLISH_FLAGS: --provenance
        run: xargs npm/publish.sh < npm-dirs.txt
